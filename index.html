<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roll or Hold is a local two-player dice game about balancing risk and reward."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://lucaspmm.github.io/roll-or-hold/" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=4" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" href="%BASE_URL%favicon.svg?v=4" sizes="any" type="image/svg+xml" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=4" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucaspmm.github.io/roll-or-hold/" />
    <meta property="og:site_name" content="Roll or Hold" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:title" content="Roll or Hold" />
    <meta
      property="og:description"
      content="A local two-player dice game about balancing risk and reward."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Roll or Hold" />
    <meta
      name="twitter:description"
      content="A local two-player dice game about balancing risk and reward."
    />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('roll-or-hold.theme')
          const hasStoredTheme = storedTheme === 'light' || storedTheme === 'dark'
          const hasDarkPreference =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          const systemTheme = hasDarkPreference ? 'dark' : 'light'
          document.documentElement.dataset.theme = hasStoredTheme ? storedTheme : systemTheme
        } catch (error) {
          console.warn('[Roll or Hold] Unable to restore the saved theme.', error)
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Roll or Hold</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
